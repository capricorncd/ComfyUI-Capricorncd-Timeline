[project]
name = "ComfyUI-Capricorncd-Timeline"
description = "A timeline editor for longer AI video projects in ComfyUI, including music videos and short dramas. Manage prompts and assets, generate and refine clips, and compose complete videos in one project."
version = "0.17.30"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

[project.optional-dependencies]
scene-detection = ["scenedetect>=0.7,<0.8"]

[project.urls]
Repository = "https://github.com/capricorncd/ComfyUI-Capricorncd-Timeline"

[tool.comfy]
PublisherId = "capricorncd"
DisplayName = "ComfyUI-Capricorncd-Timeline"
Icon = ""
Includes = []

[tool.comfy.node]
Category = "Capricorncd Timeline"

[tool.capricorncd]
schema_version = 4
