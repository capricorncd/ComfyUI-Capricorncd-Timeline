<!doctype html>
<meta charset="utf-8">
<title>Rich prompt line clipboard</title>
<div><textarea id="prompt" style="width:300px;height:180px"></textarea></div>
<div><textarea id="skill" aria-label="Prompt Skill"></textarea></div>
<div><textarea id="agent" aria-label="Agent Prompt"></textarea></div>
<pre id="result">RUNNING</pre>
<script type="module">
import { attachRichPromptHandler, detachRichPromptHandler, setRichPromptValue, syncRichPromptEnabled, toggleComment, undoRichPrompt } from '../js/components/RichPrompt.js';
const assert = (ok, message) => { if (!ok) throw Error(message); };
try {
    const ta = document.querySelector('#prompt');
    attachRichPromptHandler(ta);
    ta._capBoundWidget = {value: ''};
    let inputs = 0;
    ta.addEventListener('input', () => inputs++);
    const set = (text, start, end = start) => {
        setRichPromptValue(ta, text);
        ta.focus(); ta.setSelectionRange(start, end);
    };
    set('# Heading\n  // hidden\nhttps://example.com', 0, 9);
    assert(ta._capMirror.localName === 'cap-rich-prompt', 'shared Web Component is installed');
    assert(ta._capMirror.getAttribute('aria-hidden') === 'true', 'mirror does not duplicate accessible text');
    assert(ta._capMirror.querySelectorAll('.cap-rich-comment').length === 1, 'only slash comments are dimmed');
    toggleComment(ta);
    assert(ta.value.startsWith('//# Heading\n'), 'shortcut inserts two slashes before Markdown');
    assert(ta.selectionStart === 2 && ta.selectionEnd === 11, 'selection follows two-character prefix');
    toggleComment(ta);
    assert(ta.value.startsWith('# Heading\n'), 'shortcut restores Markdown heading');
    const clipboard = (type, text, target = ta) => {
        const data = text instanceof DataTransfer ? text : new DataTransfer();
        if (typeof text === 'string') data.setData('text/plain', text);
        const event = new ClipboardEvent(type, {clipboardData: data, bubbles: true, cancelable: true});
        target.dispatchEvent(event);
        return { event, data };
    };
    for (const [text, cursor, copied, pasted] of [
        ['first\nsecond', 2, 'first\n', 'first\nfirst\nsecond'],
        ['first\nsecond', 8, 'second\n', 'first\nsecond\nsecond'],
        ['first\nsecond', 5, 'first\n', 'first\nfirst\nsecond'],
        ['\nsecond', 0, '\n', '\n\nsecond'],
        ['first\n', 6, '\n', 'first\n\n'],
        ['', 0, '\n', '\n'],
        ['  # 中文😀\nnext', 5, '  # 中文😀\n', '  # 中文😀\n  # 中文😀\nnext'],
    ]) {
        set(text, cursor);
        const copy = clipboard('copy');
        assert(copy.event.defaultPrevented && copy.data.getData('text/plain') === copied, 'copy full logical line including indentation');
        assert(ta.value === text && ta.selectionStart === cursor, 'copy leaves content/cursor untouched');
        const before = inputs;
        clipboard('paste', copy.data);
        assert(ta.value === pasted, 'paste below current line: ' + JSON.stringify(text));
        assert(inputs === before + 1 && ta._capBoundWidget.value === pasted, 'one input event updates bound widget');
        assert(ta._capMirror.textContent.includes(pasted), 'mirror updates');
    }
    set('A\nB', 0);
    clipboard('paste', 'X\r\nY\r\n');
    assert(ta.value === 'X\nY\nA\nB', 'external multiline text pastes at cursor with normalized CRLF');
    clipboard('paste', 'Z');
    assert(ta.value === 'X\nY\nZA\nB', 'ordinary repeated paste stays at cursor');
    set('A\nB', 0, 1);
    assert(!clipboard('copy').event.defaultPrevented, 'selected-text copy remains native');
    ta.setSelectionRange(3, 3);
    clipboard('paste', 'A');
    assert(ta.value === 'A\nBA', 'selected-text copy followed by collapsed-cursor paste is inline');
    set('A\nB', 0, 1);
    clipboard('paste', 'replace');
    assert(ta.value === 'replace\nB', 'selected-text paste replaces selection in place');
    set('keep', 0, 4);
    const before = inputs;
    clipboard('paste');
    assert(ta.value === 'keep' && inputs === before, 'non-text clipboard does not delete selection');
    ta.readOnly = true;
    clipboard('paste', 'blocked');
    assert(ta.value === 'keep', 'readonly content cannot be pasted over');
    ta.dispatchEvent(new KeyboardEvent('keydown', { key: '/', code: 'Slash', ctrlKey: true, bubbles: true, cancelable: true }));
    assert(ta.value === 'keep', 'readonly full prompt cannot be changed by comment shortcut');
    ta.readOnly = false;
    set('abc', 1);
    syncRichPromptEnabled(ta, false);
    assert(!clipboard('copy').event.defaultPrevented, 'disabled rich mode keeps normal copy');
    clipboard('paste', 'X');
    assert(ta.value === 'aXbc', 'disabled rich mode keeps caret paste');
    const skill = document.querySelector('#skill');
    assert(!clipboard('copy', undefined, skill).event.defaultPrevented && !clipboard('paste', 'plain', skill).event.defaultPrevented, 'plain Prompt Skill is unaffected');
    attachRichPromptHandler(ta); attachRichPromptHandler(ta);
    set('one\ntwo', 0);
    const count = inputs;
    clipboard('paste', 'new');
    assert(inputs === count + 1 && ta.value === 'newone\ntwo', 'rebind does not duplicate handlers');
    set('source\nrest', 1);
    const lineData = clipboard('copy').data;
    set('target\ntail', 2);
    clipboard('paste', lineData);
    assert(ta.value === 'target\nsource\ntail', 'line-copy marker survives changing editor content');
    set('target\ntail', 0, 6);
    clipboard('paste', lineData);
    assert(ta.value === 'source\n\ntail', 'selection replacement takes priority over line-copy marker');
    detachRichPromptHandler(ta);
    assert(!clipboard('copy').event.defaultPrevented && !clipboard('paste', 'plain').event.defaultPrevented, 'detach removes clipboard handlers');
    attachRichPromptHandler(ta);
    set('base', 4);
    clipboard('paste', ' paste');
    assert(undoRichPrompt(ta), 'paste creates undo entry');
    assert(ta.value === 'base' && ta._capBoundWidget.value === 'base', 'undo paste updates widget');
    assert(undoRichPrompt(ta, true), 'paste redo exists');
    assert(ta.value === 'base paste', 'redo restores paste');
    ta.setSelectionRange(0, 0);
    toggleComment(ta);
    assert(ta.value === '//base paste', 'comment applied');
    undoRichPrompt(ta);
    assert(ta.value === 'base paste', 'comment undo retains preceding paste');
    undoRichPrompt(ta);
    assert(ta.value === 'base', 'paste history survives comment toggle');
    undoRichPrompt(ta, true); undoRichPrompt(ta, true);
    assert(ta.value === '//base paste' && ta._capMirror.querySelector('.cap-rich-comment'), 'redo restores comment and highlighting');
    set('different Clip', 14);
    undoRichPrompt(ta);
    assert(!ta.value.includes('base'), 'loading another Clip must not restore old Clip text');
    for (const input of [skill, document.querySelector('#agent')]) {
        attachRichPromptHandler(input, { mode: "widget" });
        setRichPromptValue(input, '# Markdown\n// note\nbody');
        assert(input._capMirror.querySelectorAll('.cap-rich-comment').length === 1, 'loaded Agent/Skill comments are dimmed');
        input.focus(); input.setSelectionRange(0, 10);
        input.dispatchEvent(new KeyboardEvent('keydown', { key: '/', code: 'Slash', ctrlKey: true, bubbles: true, cancelable: true }));
        assert(input.value.startsWith('//# Markdown'), 'Agent/Skill keyboard shortcut comments Markdown');
        setRichPromptValue(input, '');
        assert(input._capMirror.textContent === '', 'clearing Agent/Skill clears mirror');
        setRichPromptValue(input, '# Markdown\n// note\nbody');
    }
    set('route', 5);
    clipboard('paste', ' changed');
    const appSource = await (await fetch('../js/CapTimelineEditorApp.js')).text();
    const routeStart = appSource.indexOf('    handleShortcutKey(');
    const handleShortcut = new Function('undoRichPrompt', `return ({${appSource.slice(routeStart, appSource.indexOf('\n    }', routeStart) + 6)}}).handleShortcutKey`)(undoRichPrompt);
    const editor = {
        _overlay: {classList:{contains:()=>true}}, _shortcutModKey: event => event.key,
        genEditModal: {hidden:false}, undo() { throw Error('text shortcut must not undo timeline'); },
    };
    const undoEvent = new KeyboardEvent('keydown', {key:'z',ctrlKey:true,cancelable:true});
    Object.defineProperty(undoEvent, 'target', {value:ta});
    handleShortcut.call(editor, undoEvent);
    assert(ta.value === 'route' && undoEvent.defaultPrevented, 'editor routes text undo even with trim modal open');
    const redoEvent = new KeyboardEvent('keydown', {key:'z',ctrlKey:true,shiftKey:true,cancelable:true});
    Object.defineProperty(redoEvent, 'target', {value:ta});
    handleShortcut.call(editor, redoEvent);
    assert(ta.value === 'route changed', 'Ctrl+Shift+Z routes text redo');
    clipboard('paste', '!');
    undoRichPrompt(ta);
    clipboard('paste', '?');
    undoRichPrompt(ta, true);
    assert(ta.value === 'route changed?', 'new edit clears redo history');
    attachRichPromptHandler(ta); set('first\nsecond', 2);
    document.querySelector('#result').textContent = 'PASS: clipboard, comment undo/redo, selections, Clip isolation, redo branching, modal routing, widget/mirror sync and cleanup';
} catch (error) {
    document.querySelector('#result').textContent = 'FAIL: ' + error.stack;
}
</script>
