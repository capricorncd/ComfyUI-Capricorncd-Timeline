<!doctype html>
<meta charset="utf-8">
<title>Current workflow preview UI</title>
<link rel="stylesheet" href="../js/cap_timeline_editor.css">
<link rel="stylesheet" href="../js/cap_ui.css">
<script type="importmap">{"imports":{"/scripts/app.js":"data:text/javascript,export const app = {};"}}</script>
<style>body {background: #101619;} #result {position: fixed;bottom: 0;color: white;z-index:99999;}</style>
<div id="fixture"></div><pre id="result">RUNNING</pre>
<script type="module">
import '../js/components/TabButton.js';
import { iconHtml } from '../js/cap_icons.js';
import { DICT } from '../js/i18n/timeline_editor.js';
import { previewSeedValue } from '../js/editor/PreviewSeed.js';
import { formatTimecode } from '../js/timecode.js';
const T = key => DICT.zh[key] || key;
const assert = (value, message) => { if (!value) throw Error(message); };
try {
    const source = await (await fetch('../js/CapTimelineEditorApp.js')).text();
    const start = source.indexOf('<div class="cat-te-modal-backdrop cat-te-ai-optimize-modal"');
    const end = source.indexOf('<div class="cat-te-modal-backdrop cat-te-skill-picker-modal"', start);
    document.querySelector('#fixture').innerHTML = new Function('T', 'iconHtml', 'return `' + source.slice(start, end) + '`')(T, iconHtml);
    const modal = document.querySelector('.cat-te-ai-optimize-modal');
    modal.hidden = false;
    const method = name => {
        const at = source.indexOf('    ' + name + '(');
        return new Function('T', 'iconHtml', 'app', 'previewSeedValue', 'formatTimecode', 'return ({' + source.slice(at, source.indexOf('\n    }', at) + 6) + '}).' + name)(T, iconHtml, {}, previewSeedValue, formatTimecode);
    };
    const e = {
        _aiOptimizeClipId: 'clip', _workflowQueueRemaining: 0, _pendingGeneratedJobs: [],
        _findClipById: () => ({id:'clip'}), aiOptimizeModal: modal,
        aiRunBtn: modal.querySelector('.cat-te-ai-run'), aiPreviewBtn: modal.querySelector('.cat-te-ai-preview-run'),
        aiGenerateBtn: modal.querySelector('.cat-te-ai-generate'),
        aiClipDurationEl: modal.querySelector('.cat-te-ai-clip-duration-value'),
        _timeline: {fps:24},
        workflowStopBtn: modal.querySelector('.cat-te-workflow-stop'),
        aiRightTabs: modal.querySelectorAll('[data-right-tab]'), aiRightPanes: modal.querySelectorAll('[data-right-pane]'),
        aiPreviewPanel: modal.querySelector('.cat-te-ai-preview'), aiPreviewStatus: modal.querySelector('.cat-te-ai-preview-status'),
        aiPreviewVideo: modal.querySelector('.cat-te-ai-preview-video'), aiPreviewImage: modal.querySelector('.cat-te-ai-preview-image'),
        aiPreviewEmpty: modal.querySelector('.cat-te-ai-preview-empty'), _stopModelPreviewAudio() {},
        modelPreviewSeedUseBtn: modal.querySelector('.cat-te-model-preview-seed-use'),
    };
    for (const name of ['_workflowQueueBusy', '_syncWorkflowRunButton', '_setAiOptimizeRightTab', '_showWorkflowPreview', '_renderModelPreview', '_syncPreviewSeedButton', '_previewSeedForClip']) e[name] = method(name);
    e._syncWorkflowRunButton();
    assert(e.aiClipDurationEl.textContent === '00:00.00', 'missing duration uses zero');
    e._findClipById = () => ({id:'clip', duration:5.5});
    e._syncWorkflowRunButton();
    assert(e.aiClipDurationEl.textContent === '00:05.12', 'duration uses project frame timecode');
    e._findClipById = () => ({id:'next', duration:65});
    e._syncWorkflowRunButton();
    assert(e.aiClipDurationEl.textContent === '01:05.00', 'switching clip updates duration');
    const durationBounds = e.aiClipDurationEl.parentElement.getBoundingClientRect();
    const runBounds = e.aiRunBtn.getBoundingClientRect();
    assert(durationBounds.right < runBounds.left, 'duration stays left of footer actions');
    e._syncAiPromptContextControls = () => {};
    e._syncAiPromptTargetControls = () => {};
    e._syncAiOptimizeNavButtons = () => {};
    e._setAiOptimizeBusy = method('_setAiOptimizeBusy');
    e._setAiOptimizeBusy(false);
    assert(e.aiGenerateBtn.getAttribute('variant') === 'neutral', 'opening the modal keeps prompt generation secondary');
    e._setAiOptimizeBusy(true);
    assert(e.aiGenerateBtn.getAttribute('variant') === 'danger', 'prompt generation retains cancel styling');
    e._setAiOptimizeBusy(false);
    assert(e.aiGenerateBtn.getAttribute('variant') === 'neutral', 'finishing or cancelling restores secondary styling');
    assert(e.aiRunBtn.getAttribute('variant') === 'primary', 'workflow run remains the primary action');
    assert(getComputedStyle(e.aiGenerateBtn.shadowRoot.querySelector('button')).backgroundColor !== getComputedStyle(e.aiRunBtn.shadowRoot.querySelector('button')).backgroundColor, 'rendered button colors differ after state updates');
    assert(e.aiRunBtn.textContent.includes('运行与预览'), 'idle label');
    const idleRunRight = e.aiRunBtn.getBoundingClientRect().right;
    const idleRunWidth = e.aiRunBtn.getBoundingClientRect().width;
    e._workflowQueueRemaining = 1; e._syncWorkflowRunButton();
    assert(e.aiRunBtn.textContent.includes('加入运行队列'), 'busy label');
    e._workflowQueueRemaining = 0;
    e._workflowPreview = {clipId: 'clip', promptId: 'own', active: true, status: '采样 1 / 4', entry: null};
    e._setAiOptimizeRightTab('preview'); e._syncWorkflowRunButton();
    assert(e.aiGenerateBtn.hidden && getComputedStyle(e.aiGenerateBtn).display === 'none', 'prompt generation is hidden on Video Preview');
    e._setAiOptimizeRightTab('ai');
    assert(!e.aiGenerateBtn.hidden && getComputedStyle(e.aiGenerateBtn).display !== 'none', 'prompt generation returns on AI tab');
    e._setAiOptimizeRightTab('preview');
    assert(!modal.querySelector('[data-right-pane="preview"]').hidden, 'preview tab visible');
    assert(!e.workflowStopBtn.hidden && !e.workflowStopBtn.disabled, 'scoped stop is available');
    const stopBounds = e.workflowStopBtn.getBoundingClientRect();
    assert(e.workflowStopBtn.textContent.trim() === '终止任务', 'stop label is concise');
    assert(Math.abs(stopBounds.width - idleRunWidth) < 1, 'stop matches the idle run-preview width');
    assert(Math.abs(stopBounds.width - e.aiRunBtn.getBoundingClientRect().width) < 1, 'queue and stop remain equal width');
    assert(Math.abs(stopBounds.right - idleRunRight) < 1, 'stop occupies the pre-run rightmost position');
    assert(e.aiRunBtn.getBoundingClientRect().right < stopBounds.left, 'queue action stays to the left of stop');
    assert(e.workflowStopBtn.getAttribute('variant') === 'danger', 'stop uses shared delete-button styling');
    assert(getComputedStyle(e.workflowStopBtn.shadowRoot.querySelector('button')).color === 'rgb(255, 128, 128)', 'enabled stop text is red');
    assert(e.aiPreviewBtn.disabled, 'separate preview cannot overlap monitored run');
    const details = modal.querySelector('details');
    assert(!details.open && e.aiPreviewBtn.closest('details') === details, 'separate workflow collapsed and opt-in');
    const heading = details.querySelector('summary');
    const chevron = heading.querySelector('.cat-te-disclosure-chevron');
    assert(details.classList.contains('cat-te-disclosure') && chevron?.querySelector('svg'), 'preview uses shared compose disclosure style and chevron');
    assert(!heading.querySelector('input'), 'standalone preview heading has no checkbox');
    assert(getComputedStyle(heading).listStyleType === 'none', 'native marker is hidden');
    heading.click();
    assert(details.open && getComputedStyle(chevron).transform !== 'none', 'header expands settings and rotates chevron');
    heading.click();
    assert(!details.open && getComputedStyle(chevron).transform === 'none', 'header collapses settings');
    const tip = modal.querySelector('[aria-label*="preview_frames"]');
    assert(tip && tip.querySelector('svg'), 'shared info icon exists');
    tip.focus();
    await new Promise(resolve => requestAnimationFrame(resolve));
    assert(getComputedStyle(tip.querySelector('.cat-te-info-tip-pop')).display !== 'none', 'Tip shows on keyboard focus');
    assert(!modal.querySelector('.cat-te-ai-optimize-actions .cat-te-ai-preview-run'), 'only current-workflow run in primary footer');
    const clip = {id: 'clip'}, meta = {seed: -1};
    e._findClipById = () => clip;
    e._ensureClipMeta = () => meta;
    e._recordUndo = () => {};
    e._saveToWidgets = () => {};
    e.modelPreviewSeedInput = modal.querySelector('.cat-te-model-preview-seed');
    e._usePreviewSeed = method('_usePreviewSeed');
    e.modelPreviewSeedUseBtn.addEventListener('click', () => e._usePreviewSeed());
    e._syncPreviewSeedButton();
    assert(e.modelPreviewSeedUseBtn.disabled, 'cannot copy before any preview arrives');
    e._workflowPreview.seed = 1234567890123456;
    e._workflowPreview.entry = {mime: 'image/jpeg'};
    e._syncPreviewSeedButton();
    assert(!e.modelPreviewSeedUseBtn.disabled && meta.seed === -1, 'preview does not write seed automatically');
    e.modelPreviewSeedUseBtn.click();
    assert(meta.seed === 1234567890123456 && e.modelPreviewSeedInput.value === '1234567890123456', 'shared button applies actual preview seed');
    assert(e.modelPreviewSeedUseBtn.title.includes('1234567890123456'), 'actual seed is inspectable in the tooltip');
    const bounds = e.modelPreviewSeedUseBtn.getBoundingClientRect();
    const pane = e.modelPreviewSeedUseBtn.closest('[data-right-pane]').getBoundingClientRect();
    assert(bounds.left >= pane.left && bounds.right <= pane.right + 1, 'seed action fits within preview pane');
    window.previewUI = e;
    document.querySelector('#result').textContent = 'PASS: current-workflow labels, shared buttons, preview tab, scoped stop, optional standalone mode and accessible Tip';
} catch (error) {
    document.querySelector('#result').textContent = 'FAIL: ' + error.stack;
    throw error;
}
</script>
