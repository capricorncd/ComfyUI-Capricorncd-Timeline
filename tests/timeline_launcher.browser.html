<!doctype html>
<meta charset="utf-8">
<title>Timeline launcher spacing</title>
<script type="importmap">{"imports":{"/scripts/app.js":"data:text/javascript,export const app = {};"}}</script>
<link rel="stylesheet" href="../js/cap_timeline_editor.css">
<pre id="result">RUNNING</pre>
<script type="module">
import {iconHtml} from '../js/cap_icons.js';
import {DICT} from '../js/i18n/timeline_editor.js';
const assert = (value, message) => { if (!value) throw Error(message); };
try {
    const source = await (await fetch('../js/CapTimelineEditorApp.js')).text();
    const start = source.indexOf('    _buildLauncher() {');
    const body = source.slice(start, source.indexOf('\n    }', start) + 6);
    for (const lang of ['en', 'zh', 'ja']) {
        for (const width of [360, 600]) {
            let opened = 0, selected = 0;
            const node = {
                size: [width, 280],
                addDOMWidget(name, type, root, options) { this.root = root; this.options = options; return this.widget = {}; },
                computeSize() { return [360, 260 + this.widget.computeLayoutSize().minHeight]; },
                setSize(size) { this.size = size; },
            };
            const launcher = new Function('T', 'iconHtml', 'return ({' + body + '})._buildLauncher')(key => DICT[lang][key], iconHtml);
            launcher.call({node, open() { opened++; }});
            const allocation = node.options.getHeight();
            assert(allocation === node.widget.computeLayoutSize().minHeight, 'canvas and layout heights match');
            assert(node.size[0] === width && node.size[1] >= 260 + allocation, 'fits content without shrinking node');
            const holder = document.createElement('div');
            holder.style.cssText = `width:${width - 20}px;height:${allocation - 20}px;background:#333;margin:10px`;
            holder.addEventListener('click', () => selected++);
            holder.append(node.root); document.body.append(holder);
            const rootBounds = node.root.getBoundingClientRect();
            const button = node.root.querySelector('.cat-te-open-btn');
            const buttonBounds = button.getBoundingClientRect();
            const hintBounds = node.root.querySelector('.cat-te-launcher-hint').getBoundingClientRect();
            assert(rootBounds.bottom - buttonBounds.bottom >= 20, lang + ': space below button');
            assert(rootBounds.bottom - hintBounds.bottom >= 13, lang + ': hint not clipped');
            button.click();
            assert(opened === 1 && selected === 0, 'launcher opens without selecting node');
            assert(node.widget.serialize === false, 'launcher is not serialized');
        }
    }
    document.querySelector('#result').textContent = 'PASS: launcher spacing at two widths in EN/ZH/JA, sizing and click behavior';
} catch (error) {
    document.querySelector('#result').textContent = 'FAIL: ' + error.stack;
}
</script>
