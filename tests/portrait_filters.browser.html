<!doctype html><html><head><meta charset="utf-8"><title>Portrait filter verification</title>
<link rel="stylesheet" href="../js/timeline/timeline.css"><style>
body{background:#192731;color:#e5edf0;font:14px system-ui;margin:28px;--cat-font-size:14px;--cat-text:#e5edf0;--cat-raised:#24353f;--cat-border:#40515c;--cat-accent:#64d8c5}
main{display:flex;gap:24px;flex-wrap:wrap}canvas{width:256px;height:256px;image-rendering:pixelated;border:1px solid #40515c}#tracks{margin-top:24px;max-width:800px}.tl-track{position:relative}.tl-track-header{width:140px;flex:none}section{display:flex}p{max-width:800px}
</style></head><body><h2>Portrait filters</h2><p id="status">Loading…</p><main></main><div id="tracks"></div>
<script type="importmap">{"imports":{"/scripts/app.js":"data:text/javascript,export const app = {};"}}</script>
<script type="module">
import {PortraitFilterRenderer,applyLutPixels,FILTER_PRESETS} from '../js/editor/PortraitFilters.js';
import {Track} from '../js/timeline/Track.js';
const renderer=new PortraitFilterRenderer(()=>{});await renderer.ready;
const main=document.querySelector('main');const source=document.createElement('canvas');source.width=source.height=256;
const ctx=source.getContext('2d');const image=ctx.createImageData(256,256);
for(let y=0;y<256;y++)for(let x=0;x<256;x++){
 const index=(y*256+x)*4;image.data.set([x,y,(x+y)/2,255],index);
}ctx.putImageData(image,0,0);let maxError=0;
for(const preset of ['original',...FILTER_PRESETS]){
 const box=document.createElement('div'),title=document.createElement('h3'),canvas=document.createElement('canvas');
 title.textContent=preset;canvas.width=canvas.height=256;canvas.getContext('2d').drawImage(source,0,0);
 if(preset!=='original'){
  renderer.apply(canvas,[{preset,strength:0.7}]);
  const expected=new Uint8ClampedArray(image.data);applyLutPixels(expected,renderer.data,preset,0.7);
  const actual=canvas.getContext('2d').getImageData(0,0,256,256).data;
  for(let i=0;i<actual.length;i++)maxError=Math.max(maxError,Math.abs(actual[i]-expected[i]));
 }box.append(title,canvas);main.append(box);
}
const timeline={pixelsPerSecond:100,startInset:0,fps:24,_selectedIds:new Set(),emit(){},duration:10,formatTime:time=>time.toFixed(2)};
for(const type of ['filter','video']){
 const track=new Track(timeline,{type,name:type,height:type==='filter'?26:78});
 track.addClip({name:type==='filter'?'白皙 · 70%':'Video',startTime:0,duration:5});
 const row=document.createElement('section');row.append(track.headerEl,track.el);track.el.style.flex='1';document.querySelector('#tracks').append(row);
}
document.querySelector('#status').textContent=`GPU/CPU maximum difference: ${maxError}; ${renderer.gl?'WebGL2':'CPU fallback'}; track heights 26 / 78`;
window.filterTest={maxError,gpu:!!renderer.gl};
</script></body></html>
